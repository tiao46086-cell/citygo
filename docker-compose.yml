# 一台机器上的页面和后端。MySQL、Redis、RabbitMQ 只在这个网络里，不占用本机已有端口。
# 页面在 http://127.0.0.1:8080 。本机用 mvn spring-boot:run 时不用起这套。
services:
  mysql:
    image: mysql:8.0.34
    environment:
      MYSQL_ROOT_PASSWORD: ${CITYGO_DB_PASSWORD:-1234}
      MYSQL_DATABASE: hmdp
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - citygo-mysql:/var/lib/mysql
      # 只在数据目录为空时按文件名顺序执行。已有的 citygo-mysql 卷不会重跑这些脚本。
      - ./citygo.sql:/docker-entrypoint-initdb.d/01-citygo.sql:ro
      - ./sql/citygo-upgrade.sql:/docker-entrypoint-initdb.d/02-citygo-upgrade.sql:ro
      - ./sql/citygo-demo.sql:/docker-entrypoint-initdb.d/03-citygo-demo.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - citygo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: citygo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${CITYGO_RABBITMQ_USERNAME:-citygo}
      RABBITMQ_DEFAULT_PASS: ${CITYGO_RABBITMQ_PASSWORD:-citygo}
      RABBITMQ_NODENAME: rabbit@citygo-rabbitmq
    volumes:
      - citygo-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  app:
    build: .
    environment:
      CITYGO_DB_HOST: mysql
      CITYGO_DB_PORT: 3306
      CITYGO_DB_USERNAME: root
      CITYGO_DB_PASSWORD: ${CITYGO_DB_PASSWORD:-1234}
      CITYGO_REDIS_HOST: redis
      CITYGO_REDIS_PORT: 6379
      CITYGO_RABBITMQ_HOST: rabbitmq
      CITYGO_RABBITMQ_PORT: 5672
      CITYGO_RABBITMQ_USERNAME: ${CITYGO_RABBITMQ_USERNAME:-citygo}
      CITYGO_RABBITMQ_PASSWORD: ${CITYGO_RABBITMQ_PASSWORD:-citygo}
      CITYGO_UPLOAD_DIR: /data/imgs
      CITYGO_ADMIN_USER_IDS: ${CITYGO_ADMIN_USER_IDS:-}
      CITYGO_DEMO_SECKILL_INIT: "true"
      LOGGING_CHARSET_CONSOLE: UTF-8
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src/main/resources/nginx-1.18.0/html/citygo/imgs:/data/imgs

  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./src/main/resources/nginx-1.18.0/html/citygo:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  citygo-mysql:
  citygo-redis:
  citygo-rabbitmq:
