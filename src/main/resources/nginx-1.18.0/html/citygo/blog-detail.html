<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>CityGo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=citygo1">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=citygo1">
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css?v=4" rel="stylesheet">
  <link href="./css/citygo.css?v=8" rel="stylesheet">
  <link href="./css/blog-detail.css?v=7" rel="stylesheet">
</head>
<body>
<div id="app" class="cg-wide">
  <header class="cg-bar">
    <button class="cg-back" type="button" aria-label="返回" @click="goBack"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <div class="cg-bar-title">{{blog.title || "笔记"}}</div>
    <div class="cg-more-wrap" v-if="isMine">
      <button class="cg-more-btn" type="button" aria-label="更多" :aria-expanded="menuOpen ? 'true' : 'false'" @click.stop="menuOpen = !menuOpen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
      </button>
      <div class="cg-more-mask" v-if="menuOpen" @click="menuOpen = false"></div>
      <div class="cg-more-menu" v-if="menuOpen">
        <button type="button" @click="editBlog">编辑</button>
        <button type="button" :disabled="deleting" @click="removeBlog">删除</button>
      </div>
    </div>
    <button v-else class="cg-back cg-back-spacer" type="button" tabindex="-1" aria-hidden="true"></button>
  </header>
  <main class="cg-main">
    <div v-if="blogState === 'loading'" class="hint">笔记加载中</div>
    <div v-else-if="blogState === 'error'" class="hint">笔记加载失败</div>
    <template v-else>
      <div class="cg-hero">
        <img :src="currentImage" alt="" @error="onImgError">
      </div>
      <div class="cg-thumbs" v-if="blog.images && blog.images.length > 1">
        <button class="cg-thumb" :class="{on: i === activeImage}" v-for="(img, i) in blog.images" :key="i" @click="activeImage = i">
          <img :src="img" alt="" @error="onImgError">
        </button>
      </div>
      <div class="cg-author">
        <img :src="showIcon(blog.icon)" alt="" @error="onImgError">
        <div>
          <strong>{{blog.name || "用户"}}</strong>
          <div class="cg-meta">{{formatTime(blog.createTime)}}</div>
        </div>
      </div>
      <div class="cg-content">{{ plainContent(blog.content) }}</div>
      <article class="cg-card cg-shop-link" v-if="shop.id" @click="toShop">
        <img class="cg-cover" :src="shop.image" alt="" @error="onImgError">
        <div>
          <div class="cg-shop-name">{{shop.name}}</div>
          <div class="cg-meta">人均 ¥{{shop.avgPrice || "-"}}</div>
        </div>
      </article>
      <div class="cg-actions">
        <button class="cg-btn" :class="{'cg-btn-line': !blog.isLike}" :disabled="likeBusy" @click="addLike">
          {{likeBusy ? "提交中" : (blog.isLike ? "已赞 " + blog.liked : "点赞 " + blog.liked)}}
        </button>
        <button class="cg-btn" :class="{'cg-btn-line': !favorited}" :disabled="favoriteBusy" @click="toggleFavorite">
          {{favoriteBusy ? "提交中" : (favorited ? "已收藏" : "收藏")}}
        </button>
      </div>
      <div class="cg-likers" v-if="likes.length">
        <img v-for="u in likes" :key="u.id" :src="showIcon(u.icon)" alt="" @error="onImgError">
        <span>{{blog.liked}} 人点赞</span>
      </div>

      <h2 class="cg-section-title">评论（{{commentTotal}}）</h2>
      <div class="cg-comment-form">
        <input v-model="commentText" placeholder="写一条评论" @keyup.enter="submitComment">
        <button class="cg-btn" :disabled="commentSubmitting" @click="submitComment">{{commentSubmitting ? "发布中" : "发布"}}</button>
      </div>
      <div v-if="commentsState === 'loading'" class="hint">评论加载中</div>
      <div v-else-if="commentsState === 'error'" class="hint">评论加载失败</div>
      <div v-else-if="comments.length === 0" class="hint">还没有评论</div>
      <div v-else>
        <div class="cg-comment" v-for="c in comments" :key="c.id">
          <img :src="showIcon(c.icon)" alt="" @error="onImgError">
          <div>
            <strong>{{c.name || "用户"}}</strong>
            <button v-if="user && c.userId === user.id" class="cg-more" @click="removeComment(c)">删除</button>
            <p>{{c.content}}</p>
          </div>
        </div>
        <button v-if="comments.length < commentTotal" class="cg-more" @click="queryComments(commentPage + 1)">查看更多</button>
      </div>
      <p class="cg-note">学习项目，商户及交易数据仅供演示</p>
    </template>
  </main>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js?v=9"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      blog: {},
      shop: {},
      likes: [],
      comments: [],
      blogState: "loading",
      activeImage: 0,
      commentText: "",
      commentTotal: 0,
      commentPage: 1,
      commentsState: "loading",
      commentSubmitting: false,
      likeBusy: false,
      favoriteBusy: false,
      deleting: false,
      menuOpen: false,
      user: {},
      favorited: false,
      placeholder: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480"><rect width="100%" height="100%" fill="#E6EBEF"/><text x="50%" y="50%" fill="#6B7280" font-size="28" text-anchor="middle" dominant-baseline="middle">CityGo</text></svg>'
      )
    },
    computed: {
      currentImage() {
        let images = this.blog.images || [];
        return images[this.activeImage] || this.placeholder;
      },
      isMine() {
        if (!this.user || this.user.id == null || !this.blog || this.blog.userId == null) {
          return false;
        }
        return String(this.user.id) === String(this.blog.userId);
      }
    },
    created() {
      this.queryBlogById(util.getUrlParam("id"));
    },
    methods: {
      goBack() {
        history.back();
      },
      toShop() {
        if (this.shop.id) {
          location.href = "/shop-detail.html?id=" + this.shop.id;
        }
      },
      plainContent(text) {
        return String(text || "")
          .replace(/<br\s*\/?>/gi, "\n")
          .replace(/<\/p>/gi, "\n")
          .replace(/<[^>]*>/g, "")
          .replace(/&nbsp;/gi, " ")
          .replace(/&lt;/gi, "<")
          .replace(/&gt;/gi, ">")
          .replace(/&quot;/gi, "\"")
          .replace(/&#39;|&apos;/gi, "'")
          .replace(/&amp;/gi, "&");
      },
      queryBlogById(id) {
        axios.get("/blog/" + id)
          .then(({data}) => {
            if (!data) {
              this.blogState = "error";
              this.$message.error("笔记不存在");
              return;
            }
            data.images = data.images ? data.images.split(",").filter(Boolean) : [];
            this.blog = data;
            this.activeImage = 0;
            this.blogState = "ok";
            this.queryShopById(data.shopId);
            this.queryLikeList(id);
            this.queryComments(1);
            if (sessionStorage.getItem("token")) {
              this.queryLoginUser();
              this.isFavorited();
            }
          })
          .catch(err => {
            this.blogState = "error";
            this.$message.error(err);
          })
      },
      queryShopById(shopId) {
        if (!shopId) {
          return;
        }
        axios.get("/shop/" + shopId)
          .then(({data}) => {
            if (!data) {
              return;
            }
            data.image = data.images ? data.images.split(",").filter(Boolean)[0] : "";
            this.shop = data;
          })
          .catch(err => this.$message.error(err))
      },
      queryComments(page) {
        axios.get("/blog-comments/of/blog/" + this.blog.id + "?current=" + (page || 1))
          .then(resp => {
            let rows = resp.data || [];
            this.commentTotal = resp.total || 0;
            this.commentsState = "ok";
            if (!page || page === 1) {
              this.comments = rows;
              this.commentPage = 1;
            } else {
              this.comments = this.comments.concat(rows);
              this.commentPage = page;
            }
          })
          .catch(err => {
            this.commentsState = "error";
            this.$message.error(err);
          })
      },
      submitComment() {
        let text = (this.commentText || "").trim();
        if (!text) {
          this.$message.error("评论不能为空");
          return;
        }
        if (this.commentSubmitting) {
          return;
        }
        this.commentSubmitting = true;
        axios.post("/blog-comments", { blogId: this.blog.id, content: text })
          .then(() => {
            this.commentText = "";
            this.queryComments(1);
          })
          .catch(err => this.$message.error(err))
          .then(() => {
            this.commentSubmitting = false;
          })
      },
      removeComment(c) {
        axios.delete("/blog-comments/" + c.id)
          .then(() => this.queryComments(1))
          .catch(err => this.$message.error(err))
      },
      queryLikeList(id) {
        axios.get("/blog/likes/" + id)
          .then(({data}) => { this.likes = data || []; })
          .catch(err => this.$message.error(err))
      },
      addLike() {
        if (this.likeBusy) {
          return;
        }
        this.likeBusy = true;
        axios.put("/blog/like/" + this.blog.id)
          .then(() => axios.get("/blog/" + this.blog.id))
          .then(({data}) => {
            this.blog.liked = data.liked;
            this.blog.isLike = data.isLike;
            this.queryLikeList(this.blog.id);
          })
          .catch(err => this.$message.error(err))
          .then(() => { this.likeBusy = false; })
      },
      isFavorited() {
        axios.get("/blog-favorite/or/not/" + this.blog.id)
          .then(({data}) => { this.favorited = !!data; })
          .catch(err => this.$message.error(err))
      },
      toggleFavorite() {
        if (this.favoriteBusy) {
          return;
        }
        this.favoriteBusy = true;
        let request = this.favorited
          ? axios.delete("/blog-favorite/" + this.blog.id)
          : axios.put("/blog-favorite/" + this.blog.id);
        request.then(() => {
            this.favorited = !this.favorited;
            this.$message.success(this.favorited ? "已收藏" : "已取消收藏");
          })
          .catch(err => this.$message.error(err))
          .then(() => { this.favoriteBusy = false; })
      },
      formatTime(value) {
        if (!value) {
          return "";
        }
        let b = new Date(value);
        if (isNaN(b.getTime())) {
          return "";
        }
        return b.getFullYear() + "年" + (b.getMonth() + 1) + "月" + b.getDate() + "日";
      },
      editBlog() {
        this.menuOpen = false;
        location.href = "/blog-edit.html?id=" + this.blog.id;
      },
      removeBlog() {
        this.menuOpen = false;
        if (this.deleting) {
          return;
        }
        if (!window.confirm("删除这篇笔记？删除后不能恢复。")) {
          return;
        }
        this.deleting = true;
        axios.delete("/blog/me/" + this.blog.id)
          .then(() => {
            location.href = "/info.html";
          })
          .catch(err => {
            this.deleting = false;
            this.$message.error(err);
          });
      },
      queryLoginUser() {
        axios.get("/user/me")
          .then(({data}) => { this.user = data; })
          .catch(() => {})
      },
      onImgError(e) {
        if (e.target.dataset.fallback) {
          return;
        }
        e.target.dataset.fallback = "1";
        e.target.src = this.placeholder;
      }
    }
  })
</script>
</body>
</html>
