<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>CityGo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=citygo1">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=citygo1">
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css?v=4" rel="stylesheet">
  <link href="./css/citygo.css?v=8" rel="stylesheet">
  <style>
    .cg-order-card {
      padding: 14px 16px;
    }
    .cg-order-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }
    .cg-order-state {
      flex-shrink: 0;
      color: var(--cg-primary);
      font-size: 13px;
    }
    .cg-order-meta {
      margin-top: 6px;
      color: var(--cg-muted);
      font-size: 12px;
      line-height: 1.6;
      word-break: break-all;
    }
    .cg-order-pay {
      margin-top: 10px;
    }
    .cg-more {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: 0;
      background: transparent;
      color: var(--cg-primary);
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app" class="cg-wide">
  <header class="cg-bar">
    <button class="cg-back" type="button" aria-label="返回" @click="goBack"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <div class="cg-bar-title">我的订单</div>
    <button class="cg-back cg-back-spacer" type="button" tabindex="-1" aria-hidden="true"></button>
  </header>
  <main class="cg-main">
    <div v-if="state === 'loading'" class="hint">订单加载中</div>
    <div v-else-if="state === 'error'" class="hint">{{error}}</div>
    <div v-else-if="orders.length === 0" class="hint">还没有订单</div>
    <div v-else class="cg-shops">
      <article class="cg-card cg-order-card" v-for="order in orders" :key="order.orderId">
        <div class="cg-order-row">
          <div class="cg-shop-name">{{order.title || "优惠券"}}</div>
          <div class="cg-order-state">{{order.state}}</div>
        </div>
        <div class="cg-order-meta">
          <div v-if="order.shopName">{{order.shopName}}</div>
          <div v-if="order.payValue">¥ {{util.formatPrice(order.payValue)}}</div>
          <div>订单号：{{order.orderId}}</div>
          <div v-if="order.createTime">{{formatTime(order.createTime)}}</div>
        </div>
        <button v-if="order.state === '未支付'" class="cg-btn cg-order-pay" type="button" @click="pay(order)" :disabled="payingId === order.orderId">{{ payingId === order.orderId ? "支付中" : "模拟支付" }}</button>
      </article>
    </div>
    <button v-if="orders.length < total" class="cg-more" type="button" @click="query(page + 1)">查看更多</button>
    <p class="cg-note">支付只修改订单状态，不接入支付宝或微信。</p>
  </main>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js?v=4"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      util,
      orders: [],
      total: 0,
      page: 1,
      state: "loading",
      error: "",
      payingId: ""
    },
    created() {
      if (!sessionStorage.getItem("token")) {
        location.href = "/login.html";
        return;
      }
      this.query(1);
    },
    methods: {
      goBack() {
        history.back();
      },
      formatTime(value) {
        return String(value).replace("T", " ").slice(0, 16);
      },
      query(page) {
        axios.get("/voucher-order/me?current=" + (page || 1))
          .then(resp => {
            let rows = resp.data || [];
            this.total = resp.total || 0;
            this.state = "ok";
            if (!page || page === 1) {
              this.orders = rows;
              this.page = 1;
            } else {
              this.orders = this.orders.concat(rows);
              this.page = page;
            }
          })
          .catch(err => {
            this.state = "error";
            this.error = typeof err === "string" ? err : "订单加载失败";
          });
      },
      pay(order) {
        if (this.payingId || !order || !order.orderId) {
          return;
        }
        this.payingId = order.orderId;
        axios.post("/voucher-order/pay/" + order.orderId)
          .then(() => {
            order.state = "已支付";
            this.$message.success("支付成功");
          })
          .catch(err => this.$message.error(err))
          .then(() => {
            this.payingId = "";
          });
      }
    }
  });
</script>
</body>
</html>
