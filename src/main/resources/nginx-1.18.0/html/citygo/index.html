<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>CityGo</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css?v=7" rel="stylesheet">
  <link href="./css/citygo.css?v=7" rel="stylesheet">
  <link href="./css/index.css?v=4" rel="stylesheet">
</head>
<body>
<div id="app" class="cg-wide">
  <header class="cg-top">
    <div class="cg-brand">CityGo</div>
    <div class="cg-city">广州</div>
    <div class="cg-search">
      <el-input size="small" placeholder="搜索商户名" v-model="keyword" @keyup.enter.native="searchShop">
        <i slot="prefix" class="el-input__icon el-icon-search" @click="searchShop"></i>
      </el-input>
    </div>
    <button class="cg-btn-ghost" @click="toInfo">我的</button>
  </header>
  <main class="cg-main" @scroll="onScroll">
    <h2 class="cg-section-title">商户分类</h2>
    <div v-if="typesState === 'loading'" class="hint">分类加载中</div>
    <div v-else-if="typesState === 'error'" class="hint">分类加载失败</div>
    <div v-else-if="types.length === 0" class="hint">暂无分类</div>
    <div v-else class="cg-pills">
      <div class="cg-pill" v-for="t in types" :key="t.id" @click="toShopList(t.id, t.name)">{{t.name}}</div>
    </div>

    <h2 class="cg-section-title">推荐商户</h2>
    <div v-if="shopsState === 'loading'" class="hint">商户加载中</div>
    <div v-else-if="shopsState === 'error'" class="hint">商户加载失败</div>
    <div v-else-if="shops.length === 0" class="hint">暂无商户</div>
    <div v-else class="cg-shops">
      <article class="cg-card cg-shop-card" v-for="s in shops" :key="s.id" @click="toShop(s.id)">
        <img class="cg-cover" :src="s.cover" alt="" @error="onImgError">
        <div>
          <div class="cg-shop-name">{{s.name}}</div>
          <div class="cg-meta">{{typeName(s.typeId)}}<span v-if="s.area"> · {{s.area}}</span></div>
          <div class="cg-meta">人均 ¥{{s.avgPrice || "-"}}<span v-if="s.openHours"> · {{s.openHours}}</span></div>
        </div>
      </article>
    </div>

    <h2 class="cg-section-title">热门探店</h2>
    <div v-if="blogsState === 'loading'" class="hint">笔记加载中</div>
    <div v-else-if="blogsState === 'error'" class="hint">笔记加载失败</div>
    <div v-else-if="blogs.length === 0" class="hint">还没有笔记</div>
    <div v-else class="cg-blogs">
      <article class="cg-card cg-blog-card" v-for="b in blogs" :key="b.id" @click="toBlogDetail(b)">
        <img class="cg-blog-cover" :src="b.img" alt="" @error="onImgError">
        <div class="cg-blog-body">
          <div class="cg-blog-title">{{b.title}}</div>
          <div class="cg-blog-foot">
            <img class="cg-avatar" :src="showIcon(b.icon)" alt="" @error="onImgError">
            <div class="cg-author">{{b.name}}</div>
            <button class="cg-like" :class="{on: b.isLike}" @click.stop="addLike(b)">赞 {{b.liked}}</button>
          </div>
        </div>
      </article>
    </div>
    <p class="cg-note">学习项目，商户及交易数据仅供演示</p>
  </main>
  <foot-bar :active-btn="1"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js?v=8"></script>
<script src="./js/footer.js?v=7"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      isReachBottom: false,
      types: [],
      typesState: "loading",
      shops: [],
      shopsState: "loading",
      blogs: [],
      blogsState: "loading",
      current: 1,
      keyword: "",
      placeholder: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480"><rect width="100%" height="100%" fill="#E6EBEF"/><text x="50%" y="50%" fill="#6B7280" font-size="28" text-anchor="middle" dominant-baseline="middle">CityGo</text></svg>'
      )
    },
    created() {
      this.queryTypes();
      this.queryShops();
      this.queryHotBlogsScroll();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data || [];
            this.typesState = "ok";
          })
          .catch(err => {
            this.typesState = "error";
            this.$message.error(err);
          })
      },
      queryShops() {
        axios.get("/shop/of/type", { params: { typeId: 1, current: 1 } })
          .then(({data}) => {
            let rows = data || [];
            rows.forEach(s => s.cover = s.images ? s.images.split(",").filter(Boolean)[0] : "");
            this.shops = rows;
            this.shopsState = "ok";
          })
          .catch(err => {
            this.shopsState = "error";
            this.$message.error(err);
          })
      },
      typeName(id) {
        let found = this.types.find(t => String(t.id) === String(id));
        return found ? found.name : "";
      },
      queryHotBlogsScroll() {
        axios.get("/blog/hot?current=" + this.current)
          .then(({data}) => {
            let rows = data || [];
            rows.forEach(b => b.img = b.images ? b.images.split(",").filter(Boolean)[0] : "");
            this.blogs = this.blogs.concat(rows);
            this.blogsState = "ok";
          })
          .catch(err => {
            if (this.blogs.length === 0) {
              this.blogsState = "error";
            }
            this.$message.error(err);
          })
      },
      searchShop() {
        let name = (this.keyword || "").trim();
        if (!name) {
          this.$message.error("请输入商户名");
          return;
        }
        location.href = "/shop-list.html?keyword=" + encodeURIComponent(name);
      },
      toInfo() {
        location.href = "/info.html";
      },
      addLike(b) {
        axios.put("/blog/like/" + b.id)
          .then(() => this.queryBlogById(b))
          .catch(err => this.$message.error(err))
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then(({data}) => {
            b.liked = data.liked;
            b.isLike = data.isLike;
          })
          .catch(err => this.$message.error(err))
      },
      onImgError(e) {
        if (e.target.dataset.fallback) {
          return;
        }
        e.target.dataset.fallback = "1";
        e.target.src = this.placeholder;
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if (scrollTop + offsetHeight + 40 > scrollHeight && !this.isReachBottom) {
          this.isReachBottom = true;
          this.current++;
          this.queryHotBlogsScroll();
        } else {
          this.isReachBottom = false;
        }
      },
      toShopList(id, name) {
        location.href = "/shop-list.html?type=" + id + "&name=" + name;
      },
      toShop(id) {
        location.href = "/shop-detail.html?id=" + id;
      },
      toBlogDetail(b) {
        location.href = "/blog-detail.html?id=" + b.id;
      }
    }
  })
</script>
</body>
</html>
