<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>CityGo</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css?v=3" rel="stylesheet">
  <link href="./css/citygo.css?v=8" rel="stylesheet">
  <link href="./css/shop-detail.css?v=3" rel="stylesheet">
</head>
<body>
<div id="app" class="cg-wide">
  <header class="cg-bar">
    <button class="cg-back" type="button" aria-label="返回" @click="goBack"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <div class="cg-bar-title">{{shop.name || "商户"}}</div>
    <button class="cg-back cg-back-spacer" type="button" tabindex="-1" aria-hidden="true"></button>
  </header>
  <main class="cg-main">
    <div v-if="shopState === 'loading'" class="hint">店铺加载中</div>
    <div v-else-if="shopState === 'error'" class="hint">店铺加载失败</div>
    <template v-else>
      <div class="cg-hero">
        <img :src="currentImage" alt="" @error="onImgError">
      </div>
      <div class="cg-thumbs" v-if="shop.images && shop.images.length > 1">
        <button class="cg-thumb" :class="{on: i === activeImage}" v-for="(img, i) in shop.images" :key="i" @click="activeImage = i">
          <img :src="img" alt="" @error="onImgError">
        </button>
      </div>
      <div class="cg-shop-head">
        <h1>{{shop.name}}</h1>
        <div class="cg-meta">{{typeName}}<span v-if="shop.area"> · {{shop.area}}</span></div>
      </div>
      <div class="cg-card cg-facts">
        <div><span>地址</span> {{shop.address}}</div>
        <div><span>营业</span> {{shop.openHours || "未填写"}}</div>
        <div><span>人均</span> ¥{{shop.avgPrice || "-"}}</div>
      </div>

      <h2 class="cg-section-title">优惠券</h2>
      <div v-if="voucherState === 'loading'" class="hint">优惠券加载中</div>
      <div v-else-if="voucherState === 'error'" class="hint">优惠券加载失败</div>
      <div v-else-if="visibleVouchers.length === 0" class="hint">暂无优惠券</div>
      <article class="cg-card cg-ticket" v-for="v in visibleVouchers" :key="v.id">
        <div>
          <h3>{{v.title}}</h3>
          <p>{{v.subTitle}}</p>
          <p v-if="v.stock != null">剩余 {{v.stock}} 张<span v-if="v.type"> · {{formatTime(v)}}</span></p>
        </div>
        <div class="cg-ticket-side">
          <div class="cg-price">¥ {{util.formatPrice(v.payValue)}}</div>
          <p>{{discount(v)}}</p>
          <button v-if="v.type" class="cg-btn" :disabled="seckillId === v.id || buyingId === v.id || isNotBegin(v) || v.stock < 1" @click="seckill(v)">
            {{seckillId === v.id ? "提交中" : "限时抢购"}}
          </button>
          <button v-else class="cg-btn" :disabled="buyingId === v.id || seckillId || v.stock < 1" @click="buy(v)">
            {{buyingId === v.id ? "提交中" : "购买"}}
          </button>
        </div>
      </article>

      <div class="cg-card cg-pay" v-if="orderState">
        <div>订单号 {{pendingOrderId}}</div>
        <div>{{orderState}}</div>
        <button v-if="orderState === '未支付'" class="cg-btn" :disabled="paying" @click="payOrder">{{paying ? "支付中" : "模拟支付"}}</button>
        <p class="cg-note" v-if="orderState === '未支付'">支付只修改订单状态，不接入支付宝或微信。</p>
      </div>
      <p class="cg-note">学习项目，商户及交易数据仅供演示</p>
    </template>
  </main>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js?v=3"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      util,
      shop: {},
      shopState: "loading",
      types: [],
      activeImage: 0,
      shopId: "",
      vouchers: [],
      voucherState: "loading",
      seckillId: null,
      buyingId: null,
      pendingOrderId: "",
      orderState: "",
      paying: false,
      placeholder: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480"><rect width="100%" height="100%" fill="#E6EBEF"/><text x="50%" y="50%" fill="#6B7280" font-size="28" text-anchor="middle" dominant-baseline="middle">CityGo</text></svg>'
      )
    },
    computed: {
      currentImage() {
        let images = this.shop.images || [];
        return images[this.activeImage] || this.placeholder;
      },
      typeName() {
        let found = this.types.find(t => String(t.id) === String(this.shop.typeId));
        return found ? found.name : "";
      },
      visibleVouchers() {
        return this.vouchers.filter(v => !this.isEnd(v));
      }
    },
    created() {
      this.shopId = util.getUrlParam("id");
      this.queryTypes();
      this.queryShopById(this.shopId);
      this.queryVoucher(this.shopId);
    },
    methods: {
      goBack() {
        history.back();
      },
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => { this.types = data || []; })
          .catch(() => {})
      },
      queryShopById(shopId) {
        axios.get("/shop/" + shopId)
          .then(({data}) => {
            if (!data || !data.images) {
              this.shopState = "error";
              return;
            }
            data.images = data.images.split(",").filter(Boolean);
            this.shop = data;
            this.activeImage = 0;
            this.shopState = "ok";
          })
          .catch(err => {
            this.shopState = "error";
            this.$message.error(err);
          })
      },
      queryVoucher(shopId) {
        axios.get("/voucher/list/" + shopId)
          .then(({data}) => {
            this.vouchers = data || [];
            this.voucherState = "ok";
          })
          .catch(err => {
            this.voucherState = "error";
            this.$message.error(err);
          })
      },
      discount(v) {
        if (!v.actualValue) {
          return "";
        }
        return ((v.payValue * 10) / v.actualValue).toFixed(1) + "折";
      },
      formatTime(v) {
        let b = new Date(v.beginTime);
        let e = new Date(v.endTime);
        if (isNaN(b.getTime()) || isNaN(e.getTime())) {
          return "";
        }
        return this.formatDate(b) + " ~ " + this.formatDate(e);
      },
      formatDate(d) {
        return d.getFullYear() + "年"
          + (d.getMonth() + 1) + "月"
          + d.getDate() + "日 "
          + this.formatMinutes(d.getHours()) + ":"
          + this.formatMinutes(d.getMinutes());
      },
      formatMinutes(m) {
        if (m < 10) m = "0" + m;
        return m;
      },
      isNotBegin(v) {
        return new Date(v.beginTime).getTime() > new Date().getTime();
      },
      isEnd(v) {
        if (!v.endTime) {
          return false;
        }
        return new Date(v.endTime).getTime() < new Date().getTime();
      },
      onImgError(e) {
        if (e.target.dataset.fallback) {
          return;
        }
        e.target.dataset.fallback = "1";
        e.target.src = this.placeholder;
      },
      buy(v) {
        if (this.buyingId || this.seckillId) {
          return;
        }
        if (!token) {
          this.$message.error("请先登录");
          setTimeout(() => { location.href = "/login.html"; }, 200);
          return;
        }
        if (v.stock < 1) {
          this.$message.error("库存不足");
          return;
        }
        this.buyingId = v.id;
        this.orderState = "";
        this.pendingOrderId = "";
        axios.post("/voucher-order/" + v.id)
          .then(({data}) => {
            this.pendingOrderId = String(data);
            this.orderState = "未支付";
            this.queryVoucher(this.shopId);
          })
          .catch(err => this.$message.error(err))
          .then(() => { this.buyingId = null; })
      },
      seckill(v) {
        if (this.seckillId || this.buyingId) {
          return;
        }
        if (!token) {
          this.$message.error("请先登录");
          setTimeout(() => { location.href = "/login.html"; }, 200);
          return;
        }
        if (this.isNotBegin(v)) {
          this.$message.error("优惠券抢购尚未开始");
          return;
        }
        if (v.stock < 1) {
          this.$message.error("库存不足");
          return;
        }
        this.seckillId = v.id;
        this.orderState = "";
        this.pendingOrderId = "";
        axios.post("/voucher-order/seckill/" + v.id)
          .then(({data}) => {
            this.pendingOrderId = String(data);
            this.orderState = "处理中";
            this.waitUntilCreated(this.pendingOrderId, 0);
          })
          .catch(err => {
            this.seckillId = null;
            this.$message.error(err);
          })
      },
      waitUntilCreated(orderId, times) {
        axios.get("/voucher-order/" + orderId)
          .then(({data}) => {
            if (data.state === "处理中") {
              this.orderState = "处理中";
              if (times >= 30) {
                this.seckillId = null;
                return;
              }
              setTimeout(() => this.waitUntilCreated(orderId, times + 1), 500);
              return;
            }
            this.seckillId = null;
            this.orderState = data.state || "异常";
          })
          .catch(err => {
            this.seckillId = null;
            this.$message.error(err);
          })
      },
      payOrder() {
        if (this.paying || !this.pendingOrderId) {
          return;
        }
        this.paying = true;
        axios.post("/voucher-order/pay/" + this.pendingOrderId)
          .then(() => {
            this.orderState = "已支付";
            this.$message.success("支付成功");
          })
          .catch(err => this.$message.error(err))
          .then(() => { this.paying = false; })
      }
    }
  })
</script>
</body>
</html>
