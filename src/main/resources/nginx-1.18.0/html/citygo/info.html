<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>CityGo</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css?v=7" rel="stylesheet">
  <link href="./css/citygo.css?v=8" rel="stylesheet">
  <style>
    .cg-profile {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 8px 0 4px;
    }
    .cg-avatar-lg {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      background: #E6EBEF;
      flex-shrink: 0;
    }
    .cg-profile-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 14px 0 6px;
      flex-wrap: wrap;
    }
    .cg-btn-line {
      background: #fff;
      color: var(--cg-primary);
      border: 1px solid var(--cg-primary);
    }
    .cg-btn-line:hover {
      background: #F0FDFA;
    }
    #app .el-tabs__item.is-active,
    #app .el-tabs__item:hover {
      color: var(--cg-primary);
    }
    #app .el-tabs__active-bar {
      background-color: var(--cg-primary);
      background-image: none;
    }
    .cg-more {
      display: block;
      margin: 8px auto;
      background: transparent;
      border: 0;
      color: var(--cg-muted);
      cursor: pointer;
    }
    .cg-note-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .cg-note-actions button {
      padding: 4px 12px;
      min-height: 32px;
    }
  </style>
</head>
<body>
<div id="app" class="cg-wide">
  <header class="cg-bar">
    <button class="cg-back" type="button" aria-label="返回" @click="goBack"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <div class="cg-bar-title">我的</div>
    <button class="cg-back cg-back-spacer" type="button" tabindex="-1" aria-hidden="true"></button>
  </header>
  <main class="cg-main">
    <div class="cg-profile">
      <img class="cg-avatar-lg" :src="showIcon(user.icon)" alt="" @error="onImgError">
      <div>
        <div class="cg-shop-name">{{user.nickName || "未登录"}}</div>
        <div class="cg-meta">广州</div>
        <div class="cg-meta">{{info.introduce || "还没有简介"}}</div>
      </div>
    </div>
    <div class="cg-profile-actions">
      <button class="cg-btn" @click="toOrders">我的订单</button>
      <button class="cg-btn cg-btn-line" @click="toEdit">查看资料</button>
      <button class="cg-btn-ghost" @click="logout">退出登录</button>
    </div>
    <el-tabs v-model="activeName" @tab-click="handleClick">
      <el-tab-pane label="笔记" name="1">
        <div v-if="blogsState === 'loading'" class="hint">笔记加载中</div>
        <div v-else-if="blogsState === 'error'" class="hint">笔记加载失败</div>
        <div v-else-if="blogs.length === 0" class="hint">还没有笔记</div>
        <div v-else class="cg-shops">
          <article class="cg-card cg-shop-card" v-for="b in blogs" :key="b.id" @click="toBlogDetail(b)">
            <img class="cg-cover" :src="cover(b)" alt="" @error="onImgError">
            <div>
              <div class="cg-shop-name">{{b.title}}</div>
              <div class="cg-meta">赞 {{b.liked || 0}} · 评论 {{b.comments || 0}}</div>
              <div class="cg-note-actions">
                <button class="cg-btn cg-btn-line" type="button" @click.stop="editBlog(b)">编辑</button>
                <button class="cg-btn-ghost" type="button" @click.stop="removeBlog(b)">删除</button>
              </div>
            </div>
          </article>
        </div>
      </el-tab-pane>
      <el-tab-pane label="收藏" name="5">
        <div v-if="favoritesState === 'loading'" class="hint">收藏加载中</div>
        <div v-else-if="favoritesState === 'error'" class="hint">收藏加载失败</div>
        <div v-else-if="favorites.length === 0" class="hint">还没有收藏</div>
        <div v-else class="cg-shops">
          <article class="cg-card cg-shop-card" v-for="b in favorites" :key="b.id" @click="toBlogDetail(b)">
            <img class="cg-cover" :src="b.img || placeholder" alt="" @error="onImgError">
            <div>
              <div class="cg-shop-name">{{b.title}}</div>
              <div class="cg-meta">赞 {{b.liked || 0}} · 评论 {{b.comments || 0}}</div>
            </div>
          </article>
        </div>
        <button v-if="favorites.length < favoriteTotal" class="cg-more" @click="queryFavorites(favoritePage + 1)">查看更多</button>
      </el-tab-pane>
    </el-tabs>
    <p class="cg-note">学习项目，商户及交易数据仅供演示</p>
  </main>
  <foot-bar :active-btn="4"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js?v=8"></script>
<script src="./js/footer.js?v=7"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      user: {},
      activeName: "1",
      info: {},
      blogs: [],
      blogsState: "loading",
      favorites: [],
      favoritesState: "",
      favoriteTotal: 0,
      favoritePage: 1,
      placeholder: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480"><rect width="100%" height="100%" fill="#E6EBEF"/><text x="50%" y="50%" fill="#6B7280" font-size="28" text-anchor="middle" dominant-baseline="middle">CityGo</text></svg>'
      )
    },
    created() {
      this.queryUser();
    },
    methods: {
      cover(b) {
        if (!b.images) {
          return this.placeholder;
        }
        return b.images.split(",").filter(Boolean)[0] || this.placeholder;
      },
      onImgError(e) {
        if (e.target.dataset.fallback) {
          return;
        }
        e.target.dataset.fallback = "1";
        e.target.src = this.placeholder;
      },
      queryBlogs() {
        axios.get("/blog/of/me")
          .then(({data}) => {
            this.blogs = data || [];
            this.blogsState = "ok";
          })
          .catch(err => {
            this.blogsState = "error";
            this.$message.error(err);
          })
      },
      queryUser() {
        axios.get("/user/me")
          .then(({data}) => {
            this.user = data || {};
            this.queryUserInfo();
            this.queryBlogs();
          })
          .catch(() => {
            location.href = "/login.html";
          })
      },
      goBack() {
        history.back();
      },
      queryUserInfo() {
        axios.get("/user/info/" + this.user.id)
          .then(({data}) => {
            if (!data) {
              return;
            }
            this.info = data;
            sessionStorage.setItem("userInfo", JSON.stringify(data));
          })
          .catch(err => this.$message.error(err))
      },
      toEdit() {
        location.href = "/info-edit.html";
      },
      toOrders() {
        location.href = "/order.html";
      },
      logout() {
        axios.post("/user/logout")
          .then(() => {
            sessionStorage.removeItem("token");
            location.href = "/";
          })
          .catch(err => this.$message.error(err))
      },
      handleClick(tab) {
        if (tab.name === "5" && this.favoritesState !== "ok") {
          this.favoritesState = "loading";
          this.queryFavorites(1);
        }
      },
      queryFavorites(page) {
        axios.get("/blog-favorite/of/me?current=" + (page || 1))
          .then(resp => {
            let rows = resp.data || [];
            rows.forEach(b => b.img = b.images ? b.images.split(",").filter(Boolean)[0] : "");
            this.favoriteTotal = resp.total || 0;
            this.favoritesState = "ok";
            if (!page || page === 1) {
              this.favorites = rows;
              this.favoritePage = 1;
            } else {
              this.favorites = this.favorites.concat(rows);
              this.favoritePage = page;
            }
          })
          .catch(err => {
            this.favoritesState = "error";
            this.$message.error(err);
          })
      },
      toBlogDetail(b) {
        location.href = "/blog-detail.html?id=" + b.id;
      },
      editBlog(b) {
        location.href = "/blog-edit.html?id=" + b.id;
      },
      removeBlog(b) {
        if (!window.confirm("删除这篇笔记？删除后不能恢复。")) {
          return;
        }
        axios.delete("/blog/me/" + b.id)
          .then(() => {
            this.blogs = this.blogs.filter(item => item.id !== b.id);
            this.$message.success("已删除");
          })
          .catch(err => this.$message.error(err));
      }
    }
  })
</script>
</body>
</html>
