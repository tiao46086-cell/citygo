<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>CityGo</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css?v=4" rel="stylesheet">
  <link href="./css/citygo.css?v=4" rel="stylesheet">
  <style>
    .cg-login-wrap {
      display: flex;
      justify-content: center;
      padding-top: 24px;
    }
    .cg-login-card {
      box-sizing: border-box;
      width: 100%;
      max-width: 400px;
      background: var(--cg-card);
      border-radius: var(--cg-radius);
      box-shadow: var(--cg-shadow);
      padding: 20px 16px 16px;
    }
    .cg-login-lead {
      margin: 0 0 16px;
      color: var(--cg-muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .cg-code-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    .cg-code-row .el-input {
      flex: 1;
    }
    .cg-btn-line {
      background: #fff;
      color: var(--cg-primary);
      border: 1px solid var(--cg-primary);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .cg-btn-line:hover {
      background: #F0FDFA;
    }
    .cg-btn-line:disabled {
      background: #fff;
      color: #99C5C0;
      border-color: #99C5C0;
    }
    .cg-login-submit {
      width: 100%;
      margin-top: 16px;
      padding: 12px 14px;
    }
    .cg-agree {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 14px;
      color: var(--cg-muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .cg-agree input {
      margin-top: 2px;
      accent-color: var(--cg-primary);
      flex-shrink: 0;
    }
    #app .el-input__inner:focus {
      border-color: var(--cg-primary);
    }
  </style>
</head>
<body>
<div id="app" class="cg-wide">
  <header class="cg-bar">
    <button class="cg-btn-ghost" @click="goBack">返回</button>
    <div class="cg-bar-title">登录</div>
    <button class="cg-btn-ghost" style="visibility: hidden;">返回</button>
  </header>
  <main class="cg-main">
    <div class="cg-login-wrap">
      <div class="cg-login-card">
        <p class="cg-login-lead">用手机号登录。未注册的号码验证后会自动创建账户。</p>
        <el-input placeholder="请输入手机号" v-model="form.phone"></el-input>
        <div class="cg-code-row">
          <el-input placeholder="请输入验证码" v-model="form.code"></el-input>
          <button class="cg-btn cg-btn-line" type="button" @click="sendCode" :disabled="disabled">{{codeBtnMsg}}</button>
        </div>
        <button class="cg-btn cg-login-submit" type="button" @click="login" :disabled="logging">{{ logging ? "登录中" : "登录" }}</button>
        <label class="cg-agree">
          <input type="checkbox" v-model="agreed">
          <span>我已阅读并同意《CityGo用户服务协议》《隐私政策》。协议链接不跳转，本页只做登录演示。</span>
        </label>
      </div>
    </div>
  </main>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js?v=4"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      agreed: false,
      disabled: false,
      logging: false,
      codeBtnMsg: "发送验证码",
      form: {}
    },
    methods: {
      login() {
        if (this.logging) {
          return;
        }
        if (!this.agreed) {
          this.$message.error("请先确认阅读用户协议！");
          return;
        }
        if (!this.form.phone || !this.form.code) {
          this.$message.error("手机号和验证码不能为空！");
          return;
        }
        this.logging = true;
        axios.post("/user/login", this.form)
          .then(({data}) => {
            if (data) {
              sessionStorage.setItem("token", data);
            }
            location.href = "/index.html";
          })
          .catch(err => {
            this.logging = false;
            this.$message.error(err);
          });
      },
      goBack() {
        history.back();
      },
      sendCode() {
        if (this.disabled) {
          return;
        }
        if (!this.form.phone) {
          this.$message.error("手机号不能为空");
          return;
        }
        axios.post("/user/code?phone=" + this.form.phone)
          .then(() => {})
          .catch(err => {
            console.log(err);
            this.$message.error(err);
          });
        this.disabled = true;
        let i = 60;
        this.codeBtnMsg = (i--) + "秒后可重发";
        let taskId = setInterval(() => this.codeBtnMsg = (i--) + "秒后可重发", 1000);
        setTimeout(() => {
          this.disabled = false;
          clearInterval(taskId);
          this.codeBtnMsg = "发送验证码";
        }, 59000);
      }
    }
  });
</script>
</body>
</html>
